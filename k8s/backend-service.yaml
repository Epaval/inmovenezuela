apiVersion: apps/v1
kind: Deployment
metadata:
  name: inmo-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inmo-backend
  template:
    metadata:
      labels:
        app: inmo-backend
    spec:
      containers:
        - name: backend
          image: localhost/inmovenezuela-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: inmo-backend
spec:
  selector:
    app: inmo-backend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://inmo_user:inmo_pass@postgres:5432/inmovenezuela"
  JWT_SECRET: "cambiar_por_secreto_seguro"